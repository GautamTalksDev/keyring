# Keyring local harness stack: TrueForge (hosted mode) + Postgres + Redis.
#
# TrueForge hosted mode (STANDALONE=false) requires Postgres for durable storage
# and Redis for executor peering — even with a single server replica. See:
# https://trueforge.dev/quickstart
#
# Usage (from this directory):
#   cp .env.example .env
#   docker compose up --build
#
# Then open http://localhost:8791
#
# Keyring product DB: postgresql://keyring:keyring@localhost:5432/keyring
#   pnpm db:migrate

name: keyring-trueforge

services:
  # Keyring product database (grants, approval cards, audit ledger, scan runs).
  keyring-db:
    image: postgres:17
    environment:
      POSTGRES_USER: keyring
      POSTGRES_PASSWORD: keyring
      POSTGRES_DB: keyring
    ports:
      - "5432:5432"
    volumes:
      - ./data/keyring-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyring -d keyring"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17
    env_file:
      - path: .env
        required: true
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Required by TrueForge when STANDALONE=false (cross-replica turn cancel / peering).
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  trueforge:
    build:
      context: .
      dockerfile: Dockerfile.trueforge
      args:
        APP_VERSION: ${TRUEFORGE_VERSION:-0.1.4}
    image: keyring-trueforge:local
    ports:
      - "8791:8790"
    extra_hosts:
      # So MCP/stub on the host are reachable as host.docker.internal (Linux).
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 8790
      HOST: 0.0.0.0
      PUBLIC_BASE_URL: http://localhost:8791
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      STANDALONE: "false"
      REDIS_URL: redis://redis:6379
    env_file:
      - path: .env
        required: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 35s
    restart: unless-stopped
